name: Update Market Pulse Dashboard

on:
  schedule:
    # 13:00 UTC, weekdays -- after US market data settles for the day (~9am ET)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard data
        run: python3 scripts/generate_dashboard.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-pulse/data.json
          git diff --staged --quiet || git commit -m "Update market-pulse data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
